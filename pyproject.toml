[project]
name = "ambe2-neurodec"
version = "0.1.0"
description = "Experimental neural decoder for AMBE+2 half-rate (2450 bps) voice frames"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["numpy", "torch>=2.1", "soundfile"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ambe2neurodec = "ambe2_neurodec.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ambe2_neurodec"]

[tool.setuptools.package-data]
ambe2_neurodec = ["csrc/*", "csrc/include/*.h", "csrc/src/*.c", "csrc/src/*.h", "LICENSE.focalnet"]
